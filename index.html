<style>
:root{--cream:#f1e9d8;--card:#fbf7ee;--ink:#16161d;--soft:#e6dcc6;--muted:#55525a;--red:#e03c2c;--blue:#1d4ed8;--yellow:#f2b705}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;
  background-image:linear-gradient(var(--soft) 2px,transparent 2px),linear-gradient(90deg,var(--soft) 2px,transparent 2px);
  background-size:48px 48px;background-position:-1px -1px}
main{width:100%;max-width:460px;padding:56px 22px 40px;position:relative}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;display:block}
.d1{width:22px;height:22px;background:var(--red);top:28px;left:22px}
.d2{width:14px;height:14px;background:var(--yellow);top:64px;left:58px}
.d3{width:14px;height:14px;background:var(--blue);top:28px;left:70px}
header{text-align:center;margin-bottom:34px}
.check{width:84px;height:74px;display:block;margin:0 auto 18px}
.px{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.wm{height:124px;width:auto;display:block;margin:0 auto}
.tag{height:26px;width:auto;display:block;margin:16px auto 0}
.sub{height:20px;width:auto;display:block;margin:26px auto 0}
nav{display:flex;flex-direction:column;gap:16px}
.btn{display:flex;align-items:center;gap:14px;background:var(--card);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);
  padding:16px 18px;text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .12s;
  animation:rise .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--ink)}
.btn:active{transform:translate(5px,5px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--red);outline-offset:4px}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.chip{width:22px;height:22px;flex:none;border:3px solid var(--ink)}
.lab{height:24px;width:auto;flex:none}
.handle{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;color:var(--muted);direction:ltr;margin-inline-start:auto}
.arrow{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:18px}
footer{margin-top:40px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);direction:ltr}
@media (prefers-reduced-motion:reduce){.px,.btn{animation:none}}
</style>
